<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="200" height="200" fill="#ffffff"/>
  <g fill="#16a34a">
    <!-- Head -->
    <circle cx="100" cy="40" r="16"/>
    <!-- Neck -->
    <rect x="92" y="53" width="16" height="10" rx="2"/>
    <!-- Torso: broad shoulders tapering to waist -->
    <path d="M 72,64 L 128,64 L 134,102 Q 100,114 66,102 Z"/>
    <!-- Hips -->
    <path d="M 66,100 L 134,100 L 126,120 L 74,120 Z"/>
    <!-- Left leg -->
    <path d="M 76,120 L 96,120 L 91,188 L 72,188 L 70,170 Z"/>
    <!-- Right leg -->
    <path d="M 104,120 L 124,120 L 130,170 L 128,188 L 109,188 Z"/>
    <!-- Left arm: upper arm (horizontal, out to the side) -->
    <ellipse cx="56" cy="66" rx="16" ry="11"/>
    <!-- Left arm: forearm bent up toward head -->
    <ellipse cx="43" cy="47" rx="9" ry="20" transform="rotate(12 43 47)"/>
    <!-- Left fist -->
    <circle cx="46" cy="28" r="11"/>
    <!-- Right arm: upper arm (horizontal, out to the side) -->
    <ellipse cx="144" cy="66" rx="16" ry="11"/>
    <!-- Right arm: forearm bent up toward head -->
    <ellipse cx="157" cy="47" rx="9" ry="20" transform="rotate(-12 157 47)"/>
    <!-- Right fist -->
    <circle cx="154" cy="28" r="11"/>
  </g>
</svg>
